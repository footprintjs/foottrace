        id: upload
        with:
          name: foottrace-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}-build
          path: |
            release-artifact/package.tgz
            release-artifact/manifest.json
          if-no-files-found: error
          retention-days: 90
  release:
    needs: [plan, authority, build]
    if: always() && !cancelled() && needs.plan.result == 'success' && needs.authority.result == 'success' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
      pull-requests: read
    outputs:
      grant: ${{ steps.control.outputs.grant }}
      fresh: ${{ steps.control.outputs.fresh }}
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.21.0
      - id: control
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_JSON: ${{ needs.plan.outputs.plan }}
          IDENTITY_JSON: ${{ needs.authority.outputs.identity }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact }}
        run: |
          # trusted-stage: release
          node <<'FOOTTRACE_RELEASE'
          "use strict";
          (async()=>{
          const payload="";
          const program=require("node:zlib").brotliDecompressSync(Buffer.from(payload,"base64"),{maxOutputLength:56091});
          if(program.length!==56091||require("node:crypto").createHash("sha256").update(program).digest("hex")!=="0b1734e84b8395bbc17aa4035e873017b5b5b787e0781acbb3068e42846f9e6e")throw new Error("trusted-program-integrity");
          return new Function("require","process",program.toString("utf8"))(require,process);
          })().catch(error=>{console.error(error.code??error.message??"release-failed");process.exitCode=1;});
          FOOTTRACE_RELEASE
  publish:
    needs: [plan, authority, build, release]
    if: always() && !cancelled() && needs.plan.result == 'success' && needs.authority.result == 'success' && needs.build.result == 'success' && needs.release.result == 'success' && needs.release.outputs.fresh == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.21.0
          registry-url: https://registry.npmjs.org
      - name: Require the pinned bundled npm
        run: test "$(npm --version)" = '11.19.0'
      - id: control
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_JSON: ${{ needs.plan.outputs.plan }}
          IDENTITY_JSON: ${{ needs.authority.outputs.identity }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact }}
          GRANT_JSON: ${{ needs.release.outputs.grant }}
        run: |
          # trusted-stage: publish
          node <<'FOOTTRACE_RELEASE'
          "use strict";
          (async()=>{
          const payload="";
          const program=require("node:zlib").brotliDecompressSync(Buffer.from(payload,"base64"),{maxOutputLength:56091});
          if(program.length!==56091||require("node:crypto").createHash("sha256").update(program).digest("hex")!=="8cbd8ccc86a53db3e39d2fc9ebccc5fbcd901aa267d85db5ab75ceaed53dfc05")throw new Error("trusted-program-integrity");
