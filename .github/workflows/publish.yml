          FOOTTRACE_RELEASE
  prepare:
    needs: plan
    if: needs.plan.outputs.mode == 'prepare'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.21.0
      - env:
          GH_TOKEN: ${{ github.token }}
          PLAN_JSON: ${{ needs.plan.outputs.plan }}
        run: |
          # trusted-stage: prepare
          node <<'FOOTTRACE_RELEASE'
          "use strict";
          (async()=>{
          const payload="";
          const program=require("node:zlib").brotliDecompressSync(Buffer.from(payload,"base64"),{maxOutputLength:56091});
          if(program.length!==56091||require("node:crypto").createHash("sha256").update(program).digest("hex")!=="58247572affda778a98de02bf39270a6d21ea08dea265b8a329922d80e1f2043")throw new Error("trusted-program-integrity");
          return new Function("require","process",program.toString("utf8"))(require,process);
