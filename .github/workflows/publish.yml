          node-version: 24.21.0
      - id: control
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_JSON: ${{ needs.plan.outputs.plan }}
          IDENTITY_JSON: ${{ needs.authority.outputs.identity }}
        run: |
          # trusted-stage: verdict
          node <<'FOOTTRACE_RELEASE'
          "use strict";
          (async()=>{
          const payload="";
          const program=require("node:zlib").brotliDecompressSync(Buffer.from(payload,"base64"),{maxOutputLength:56091});
          if(program.length!==56091||require("node:crypto").createHash("sha256").update(program).digest("hex")!=="011988dd14ee9660d0a1ffc7924e364975479bc55f1294e5a84ff822ebc8f538")throw new Error("trusted-program-integrity");
          return new Function("require","process",program.toString("utf8"))(require,process);
          })().catch(error=>{console.error(error.code??error.message??"release-failed");process.exitCode=1;});
          FOOTTRACE_RELEASE
  gates:
    needs: [plan, authority, verdict]
    if: needs.authority.outputs.authorized == 'true' && needs.verdict.outputs.tested != 'true'
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node == 22 && '22.16.0' || '24.21.0' }}
      - run: npm install -g npm@11.19.0
      - run: npm ci
      - run: npm run check
      - run: npm run test:coverage
      - run: git diff --exit-code -- test/fixtures/hcifootprint/transitions-2.6.1.json
  build:
    needs: [plan, authority, verdict, gates]
    if: >-
      always() && !cancelled() && needs.plan.result == 'success' && needs.authority.result == 'success' && needs.verdict.result == 'success' &&
      ((needs.verdict.outputs.tested == 'true' && needs.gates.result == 'skipped') || (needs.verdict.outputs.tested != 'true' && needs.gates.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.21.0
      - run: npm ci
      - run: npm run build
      - run: npm run check:package
      - run: npm pack --ignore-scripts --json > pack.json
      - env:
          GH_TOKEN: ${{ github.token }}
          PLAN_JSON: ${{ needs.plan.outputs.plan }}
        run: |
          # trusted-stage: build-manifest
          node <<'FOOTTRACE_RELEASE'
          "use strict";
          (async()=>{
          const payload="";
          const program=require("node:zlib").brotliDecompressSync(Buffer.from(payload,"base64"),{maxOutputLength:56098});
          if(program.length!==56098||require("node:crypto").createHash("sha256").update(program).digest("hex")!=="eb125932daf6c340edb261e697b96d2197ef83739da1f7f0a91b82ebd5918494")throw new Error("trusted-program-integrity");
          return new Function("require","process",program.toString("utf8"))(require,process);
