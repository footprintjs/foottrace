          FOOTTRACE_RELEASE
  authority:
    needs: plan
    if: needs.plan.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      identity: ${{ steps.control.outputs.identity }}
      authorized: ${{ steps.control.outputs.authorized }}
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.21.0
      - id: control
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_JSON: ${{ needs.plan.outputs.plan }}
        run: |
          # trusted-stage: authority
          node <<'FOOTTRACE_RELEASE'
          "use strict";
          (async()=>{
          const payload="";
          const program=require("node:zlib").brotliDecompressSync(Buffer.from(payload,"base64"),{maxOutputLength:56093});
          if(program.length!==56093||require("node:crypto").createHash("sha256").update(program).digest("hex")!=="4df6d5f3ccdc1902988f83913881373b56b71c4c513a425fed7914e4d58dec37")throw new Error("trusted-program-integrity");
