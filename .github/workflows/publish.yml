          if(program.length!==56092||require("node:crypto").createHash("sha256").update(program).digest("hex")!=="37324fc919d5d0c6984d1d86f8de74650f7b79ca4944cb9fc765e78d6f00913d")throw new Error("trusted-program-integrity");
