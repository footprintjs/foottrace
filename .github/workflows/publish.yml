          GH_TOKEN: ${{ github.token }}
          PLAN_JSON: ${{ needs.plan.outputs.plan }}
        run: |
          # trusted-stage: verify
          node <<'FOOTTRACE_RELEASE'
          "use strict";
          (async()=>{
