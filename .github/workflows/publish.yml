          FOOTTRACE_RELEASE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: foottrace-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}-prepare
          path: |
            release-artifact/proposal.json
            release-artifact/manifest.json
          if-no-files-found: error
          retention-days: 30
  proposal:
    needs: [plan, prepare]
    if: needs.plan.outputs.mode == 'prepare' && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.21.0
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: footprintjs
          repositories: foottrace
          permission-contents: write
          permission-pull-requests: write
          permission-actions: read
      - env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PLAN_JSON: ${{ needs.plan.outputs.plan }}
          ARTIFACT_ID: ${{ needs.prepare.outputs.artifact }}
