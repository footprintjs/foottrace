name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        node: [22, 24]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node == 22 && '22.16.0' || '24.21.0' }}
      - run: npm install -g npm@11.19.0
      - run: npm ci
      - run: npm run check
      - run: npm run test:coverage
      - run: git diff --exit-code -- test/fixtures/hcifootprint/transitions-2.6.1.json
      - name: Pack reader for downstream consumer proof
        if: github.event_name == 'pull_request' && matrix.node == 24
        run: |
          mkdir -p "$RUNNER_TEMP/foottrace-pack"
          npm pack --ignore-scripts --offline --pack-destination "$RUNNER_TEMP/foottrace-pack"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'pull_request' && matrix.node == 24
        with:
          name: foottrace-reader-pack-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/foottrace-pack/*.tgz
          if-no-files-found: error
          retention-days: 7
  paired-record-exploration:
    name: Paired-record exploration (advisory)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.21.0'
      - run: npm install -g npm@11.19.0
      - run: npm ci
      - name: Report a fresh seed and check its paired records
        continue-on-error: true
        shell: bash
        run: |
          seed="$(node -p 'require("node:crypto").randomInt(1, 2 ** 31)')"
          echo "Source-link exploration seed $seed" | tee -a "$GITHUB_STEP_SUMMARY"
          if FOOTTRACE_PAIR_EXPLORATION_SEED="$seed" npm test -- src/lib/cause/sourceLinks/pairedRecord.property.test.ts; then
            echo 'Paired-record exploration passed.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Paired-record exploration found a counterexample. See the test log for its seed and path.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
  tested-tree:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: tree
        run: echo "sha=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
      - name: tested tree ${{ steps.tree.outputs.sha }}
        run: test -n "$TESTED_TREE"
        env:
          TESTED_TREE: ${{ steps.tree.outputs.sha }}
