# Generated by scripts/render-release-workflow.cjs. Edit its template/helpers.
name: Release App
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      verify_only:
        description: Inspect the existing release without preparation or submission
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: foottrace-release
  cancel-in-progress: false
env:
  REPO_ID: ${{ github.repository_id }}
  REPO_NAME: ${{ github.repository }}
  SOURCE_SHA: ${{ github.sha }}
  SOURCE_REF: ${{ github.ref }}
  EVENT_NAME: ${{ github.event_name }}
  RUN_ID: ${{ github.run_id }}
  RUN_ATTEMPT: ${{ github.run_attempt }}
  VERIFY_ONLY: ${{ inputs.verify_only == true && 'true' || 'false' }}
  APP_CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID }}
  APP_SLUG: ${{ vars.RELEASE_APP_SLUG }}
jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.control.outputs.plan }}
      mode: ${{ steps.control.outputs.mode }}
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.21.0
      - id: control
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          @@INLINE:plan@@
  prepare:
    needs: plan
    if: needs.plan.outputs.mode == 'prepare'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.21.0
      - env:
          GH_TOKEN: ${{ github.token }}
          PLAN_JSON: ${{ needs.plan.outputs.plan }}
        run: |
          @@INLINE:prepare@@
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: foottrace-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}-prepare
          path: |
            release-artifact/proposal.json
            release-artifact/manifest.json
          if-no-files-found: error
          retention-days: 30
  proposal:
    needs: [plan, prepare]
    if: needs.plan.outputs.mode == 'prepare' && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.21.0
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: footprintjs
          repositories: foottrace
          permission-contents: write
          permission-pull-requests: write
          permission-actions: read
      - env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PLAN_JSON: ${{ needs.plan.outputs.plan }}
          ARTIFACT_ID: ${{ needs.prepare.outputs.artifact }}
        run: |
          @@INLINE:proposal@@
  authority:
    needs: plan
    if: needs.plan.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      identity: ${{ steps.control.outputs.identity }}
      authorized: ${{ steps.control.outputs.authorized }}
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.21.0
      - id: control
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_JSON: ${{ needs.plan.outputs.plan }}
        run: |
          @@INLINE:authority@@
  verdict:
    needs: [plan, authority]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tested: ${{ steps.control.outputs.tested }}
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.21.0
      - id: control
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_JSON: ${{ needs.plan.outputs.plan }}
          IDENTITY_JSON: ${{ needs.authority.outputs.identity }}
        run: |
          @@INLINE:verdict@@
  gates:
    needs: [plan, authority, verdict]
    if: needs.authority.outputs.authorized == 'true' && needs.verdict.outputs.tested != 'true'
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node == 22 && '22.16.0' || '24.21.0' }}
      - run: npm install -g npm@11.19.0
      - run: npm ci
      - run: npm run check
      - run: npm run test:coverage
      - run: git diff --exit-code -- test/fixtures/hcifootprint/transitions-2.6.1.json
  build:
    needs: [plan, authority, verdict, gates]
    if: >-
      always() && !cancelled() && needs.plan.result == 'success' && needs.authority.result == 'success' && needs.verdict.result == 'success' &&
      ((needs.verdict.outputs.tested == 'true' && needs.gates.result == 'skipped') || (needs.verdict.outputs.tested != 'true' && needs.gates.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.21.0
      - run: npm ci
      - run: npm run build
      - run: npm run check:package
      - run: npm pack --ignore-scripts --json > pack.json
      - env:
          GH_TOKEN: ${{ github.token }}
          PLAN_JSON: ${{ needs.plan.outputs.plan }}
        run: |
          @@INLINE:build-manifest@@
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: foottrace-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}-build
          path: |
            release-artifact/package.tgz
            release-artifact/manifest.json
          if-no-files-found: error
          retention-days: 90
  release:
    needs: [plan, authority, build]
    if: always() && !cancelled() && needs.plan.result == 'success' && needs.authority.result == 'success' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
      pull-requests: read
    outputs:
      grant: ${{ steps.control.outputs.grant }}
      fresh: ${{ steps.control.outputs.fresh }}
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.21.0
      - id: control
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_JSON: ${{ needs.plan.outputs.plan }}
          IDENTITY_JSON: ${{ needs.authority.outputs.identity }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact }}
        run: |
          @@INLINE:release@@
  publish:
    needs: [plan, authority, build, release]
    if: always() && !cancelled() && needs.plan.result == 'success' && needs.authority.result == 'success' && needs.build.result == 'success' && needs.release.result == 'success' && needs.release.outputs.fresh == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.21.0
          registry-url: https://registry.npmjs.org
      - name: Require the pinned bundled npm
        run: test "$(npm --version)" = '11.19.0'
      - id: control
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_JSON: ${{ needs.plan.outputs.plan }}
          IDENTITY_JSON: ${{ needs.authority.outputs.identity }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact }}
          GRANT_JSON: ${{ needs.release.outputs.grant }}
        run: |
          @@INLINE:publish@@
      - name: Submit the one checked archive
        if: steps.control.outputs.submit == 'true'
        env:
          PACKAGE_FILE: ${{ steps.control.outputs.file }}
          NODE_AUTH_TOKEN: ''
        run: npm publish "$PACKAGE_FILE" --ignore-scripts --access public
  verify:
    needs: [plan, authority, build, release, publish]
    if: >-
      always() && !cancelled() && needs.plan.result == 'success' &&
      (needs.plan.outputs.mode == 'verify' || (needs.release.result == 'success' && (needs.release.outputs.fresh == 'false' || needs.publish.result == 'success' || needs.publish.result == 'failure')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.21.0
      - id: control
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_JSON: ${{ needs.plan.outputs.plan }}
        run: |
          @@INLINE:verify@@
      - env:
          VERIFICATION: ${{ steps.control.outputs.verification }}
        run: node -e 'require("node:fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY,process.env.VERIFICATION+"\n")'
